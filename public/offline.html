<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Sei offline – VocePreventivo</title>
<style>
:root{color-scheme:light dark;--bg:#f3f6f7;--text:#0f1d22;--muted:#43565d;--primary:#0b5c6b;--on:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0c1519;--text:#eef4f6;--muted:#a9bcc2;--primary:#4fb3c4;--on:#05181d}}
body{margin:0;background:var(--bg);color:var(--text);font:1.0625rem/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100dvh;display:grid;place-items:center;padding:24px}
main{max-width:30rem}h1{font-size:1.625rem;margin:0 0 .5rem}p{color:var(--muted)}
a{display:inline-flex;align-items:center;min-height:52px;padding:0 24px;border-radius:14px;background:var(--primary);color:var(--on);font-weight:700;text-decoration:none}
a:focus-visible{outline:3px solid #ff8a3d;outline-offset:2px}
</style>
</head>
<body><main><h1>Sei offline</h1><p>Questa pagina non è ancora salvata sul dispositivo. I tuoi preventivi e le tue fatture restano al sicuro qui: l’app funziona anche senza rete.</p><a href="./#/">Torna all’app</a></main></body>
</html>
