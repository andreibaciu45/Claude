name: Deploy produzione

# SOLO MANUALE: non parte mai da solo (nessun trigger push/PR/schedule).
# Variante SENZA Docker: compila il frontend in CI, carica la release via SSH
# e lancia deploy-nodocker.sh sul server (con rollback automatico).
# Richiede l'approvazione dell'ambiente "production" (Settings > Environments).
#
# Segreti da creare in Settings > Environments > production > Environment secrets:
#   VPS_HOST         nome DNS o IP del server
#   VPS_USER         utente SSH non-root di deploy
#   VPS_SSH_KEY      chiave PRIVATA SSH dedicata al deploy
#   VPS_KNOWN_HOSTS  riga di known_hosts del server (da `ssh-keyscan -t ed25519 HOST`, verificata)
#   DEPLOY_PATH      cartella applicazione sul server: /opt/vocepreventivo
#   VPS_PORT         (facoltativo) porta SSH, default 22
# Nessun valore e' scritto in questo file.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag o commit da distribuire"
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build e deploy via SSH (senza Docker)
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Controlla che i segreti esistano
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          for v in VPS_HOST VPS_USER DEPLOY_PATH SSH_KEY KNOWN_HOSTS; do
            if [ -z "${!v}" ]; then echo "::error::Segreto mancante: $v"; exit 1; fi
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installa dipendenze e compila il frontend (Vite)
        run: |
          npm ci --no-audit --no-fund
          npx vite build

      - name: Prepara la release
        id: rel
        run: |
          tag="$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          mkdir -p release
          cp -r dist release/dist
          cp -r shared release/shared
          cp -r infra release/infra
          rm -f release/infra/.env
          mkdir -p release/server
          cp -r server/src server/package.json server/package-lock.json server/tsconfig.json release/server/
          if [ -d server/migrations ]; then cp -r server/migrations release/server/; fi

      - name: Prepara SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          (umask 077; printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key)

      - name: Carica la release sul server
        env:
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          set -euo pipefail
          SSH=(ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes -p "${VPS_PORT:-22}" "${VPS_USER}@${VPS_HOST}")
          remote_rel="$(printf '%q' "${DEPLOY_PATH}/releases/${TAG}")"
          "${SSH[@]}" "mkdir -p $remote_rel"
          tar -C release -czf - . | "${SSH[@]}" "tar -xzf - -C $remote_rel"

      - name: Esegui deploy sul server (con rollback automatico)
        env:
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          set -euo pipefail
          SSH=(ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes -p "${VPS_PORT:-22}" "${VPS_USER}@${VPS_HOST}")
          remote_path="$(printf '%q' "$DEPLOY_PATH")"
          "${SSH[@]}" "chmod +x $remote_path/releases/${TAG}/infra/scripts/*.sh && APP_DIR=$remote_path $remote_path/releases/${TAG}/infra/scripts/deploy-nodocker.sh '${TAG}'"

      - name: Pulizia chiave
        if: always()
        run: rm -f ~/.ssh/deploy_key
