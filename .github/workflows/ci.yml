name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, test e build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Installa dipendenze (client)
        run: npm ci --no-audit --no-fund

      - name: Installa dipendenze (server)
        run: npm ci --no-audit --no-fund
        working-directory: server

      - name: Typecheck client + shared
        run: npx tsc --noEmit

      - name: Typecheck server
        run: npm run typecheck
        working-directory: server

      - name: Test client
        run: npx vitest run

      - name: Test server
        run: npm test
        working-directory: server

      - name: Build Vite
        run: npx vite build

  infra-lint:
    name: Controllo script e compose
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck
        run: |
          cd infra/scripts
          shellcheck -x ./*.sh
      - name: Valida docker-compose (variante facoltativa)
        run: |
          cd infra
          cp .env.example .env
          docker compose config -q
